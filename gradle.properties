# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# Sandbox blocks native file events (File watcher server / error = 5)
org.gradle.vfs.watch=false
# maven.neoforged.net intermittently black-holes TCP from this network: fail over instead of stalling.
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=30000

# Mod metadata
mod_id=waystone_xp_payment
mod_version=0.1.0
mod_group=com.olynk.waystonexppayment
mod_name=Waystone XP Payment
mod_authors=0Lynk
mod_license=MIT
mod_description=Pay Waystones teleport costs from a shared experience-fluid tank instead of player XP.

# Version slots (compatible with Minecraft 1.21.1 / NeoForge 21.1.x)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.8
neo_version_range=[21.1.0,)
loader_version_range=[4,)
waystones_version=21.1.46+1.21.1
waystones_version_range=[21.1.46,)
balm_version=21.0.59+1.21.1
ftbteams_version=2101.1.11
ftbteams_version_range=[2101.1.0,)
kubejs_version=2101.7.2-build.379
kubejs_version_range=[2101.0.0,)
