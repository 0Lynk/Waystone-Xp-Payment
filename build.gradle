plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group
base { archivesName = mod_id }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { name = 'TwelveIterations'; url = 'https://maven.twelveiterations.com/repository/maven-public/' }
    maven { name = 'FTB'; url = 'https://maven.ftb.dev/releases/' }
    maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases/' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "net.blay09.mods:waystones-neoforge:${waystones_version}"
    // Waystones' POM declares Balm as runtime-only, but the API we compile against (BalmEvent, Balm.getEvents)
    // lives there, so it has to be on the compile classpath too.
    implementation "net.blay09.mods:balm-neoforge:${balm_version}"

    // FTB Teams is a soft dependency reached through reflection (see FtbTeamsResolver), so the build does not
    // need FTB's own maven repository.

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // MixinShadowPolicyTest loads the real target classes (Waystones and the vanilla client ones it inherits
    // from) to check that every @Shadow member is declared by its target. The NeoForge artifact that carries
    // the vanilla classes stays on the compile classpath only, so it has to be added here for the test run.
    classpath += sourceSets.main.compileClasspath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Expand ${...} placeholders inside mod metadata (MDG does not do this for us).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_group              : mod_group,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            waystones_version      : waystones_version,
            waystones_version_range: waystones_version_range,
            ftbteams_version_range : ftbteams_version_range,
            kubejs_version_range   : kubejs_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
